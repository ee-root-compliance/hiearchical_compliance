name: G1HLEEXYZRANGE100600FORCEBSTUDENT

defaults:
  - /task/G1/hl/ee/G1_hl_ee_compliance_pos_delta_force_b_student@_here_
  - /task/G1/hl/task/ee_compliance_xyz_range@_here_
  - _self_

action:
  ee_command:
    # 30 N / 100 N/m = 0.30 m; the policy output must cover the 100-N/m end.
    pos_scale: [0.35, 0.35, 0.35]

command:
  # Mixed reset distribution: continuous xyz values, discrete levels, and
  # important endpoint/axis-anchor combinations.
  net_pull_ee_compliance_stiffness_xyz_range:
    - [100.0, 100.0, 100.0]
    - [600.0, 600.0, 600.0]
  net_pull_ee_compliance_stiffness_levels:
    [100.0, 150.0, 200.0, 300.0, 400.0, 500.0, 550.0, 600.0]
  net_pull_ee_compliance_stiffness_levels_prob: 0.30
  net_pull_ee_compliance_stiffness_xyz_anchors:
    - [100.0, 100.0, 100.0]
    - [600.0, 600.0, 600.0]
    - [100.0, 600.0, 600.0]
    - [600.0, 100.0, 600.0]
    - [600.0, 600.0, 100.0]
    - [400.0, 600.0, 600.0]
    - [600.0, 400.0, 600.0]
    - [600.0, 600.0, 400.0]
    - [150.0, 300.0, 500.0]
    - [150.0, 500.0, 300.0]
    - [300.0, 150.0, 500.0]
    - [300.0, 500.0, 150.0]
    - [500.0, 150.0, 300.0]
    - [500.0, 300.0, 150.0]
  net_pull_ee_compliance_stiffness_anchor_prob: 0.20
  synthetic_ee_target:
    enabled: true
    train_only: true
    prob: 0.25

reward:
  ee_compliance:
    ee_force_compliance_tracking:
      stiffness: [100.0, 100.0, 100.0]
      max_offset: [0.35, 0.35, 0.35]
    ee_force_stiffness_consistency:
      weight: 3.0
      force_scale: 15.0
      sigma: 1.0
      force_deadband: 0.5
    ee_force_limit_penalty:
      stiffness: [100.0, 100.0, 100.0]
      force_limit: [15.0, 15.0, 15.0]
      use_command_stiffness: true
