name: G1HLEEZ100COMPLIANCEPOSDELTAFORCEBSTUDENT

defaults:
  - /task/G1/hl/ee/G1_hl_ee_compliance_pos_delta_force_b_student@_here_
  - _self_

command:
  # Keep random pulls inside the hand/root workspace. Infeasible directions
  # are resampled instead of immediately cancelling the disturbance.
  net_pull_margin_aware: true
  net_pull_margin_safety: 0.95
  # Use matching left/right coordinate extents while preserving the hands'
  # mirrored y-axis convention. Bounds use the largest absolute observed
  # extent from the original left/right P5-P95 boxes.
  net_pull_margin_left_range:
    - [-0.045, 0.038, -0.205]
    - [0.421, 0.537, 0.441]
  net_pull_margin_right_range:
    - [-0.045, -0.537, -0.205]
    - [0.421, -0.038, 0.441]

action:
  ee_command:
    # 30 N / 100 N/m = 0.30 m. Leave margin so the largest training probe
    # does not saturate the position command or the compliance target.
    pos_scale: [0.15, 0.15, 0.35]

reward:
  ee_compliance:
    ee_force_compliance_tracking:
      stiffness: [600.0, 600.0, 100.0]
      max_offset: [0.05, 0.05, 0.35]
    ee_force_limit_penalty:
      force_limit: [30.0, 30.0, 15.0]
